model:
  base_model: "unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit"
  max_seq_length: 2048
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  use_gradient_checkpointing: "unsloth"

sft:
  output_dir: "./outputs/sft_model"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  fp16: false
  bf16: true
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3
  report_to: "wandb"
  run_name: "code-review-sft"

dpo:
  output_dir: "./outputs/dpo_model"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-5
  beta: 0.1
  max_prompt_length: 1024
  max_length: 2048
  report_to: "wandb"
  run_name: "code-review-dpo"

data:
  sft_dataset_path: "./data/sft_dataset"
  dpo_dataset_path: "./data/dpo_dataset"
  train_split: 0.9
  val_split: 0.1
  seed: 42

hub:
  push_to_hub: true
  hub_model_id: "your-username/code-review-llm"
  private: false
